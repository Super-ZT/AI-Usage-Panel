name: usage-panel

x-app-security: &app-security
  read_only: true
  init: true
  cap_drop: [ALL]
  # Entry point uses these only to copy the root-readable Docker secret into
  # tmpfs and switch to uid/gid 1000; runuser drops them before Node starts.
  cap_add: [CHOWN, SETUID, SETGID]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  pids_limit: 128
  mem_limit: 384m
  cpus: 1.0

x-app-environment: &app-environment
  USAGE_PANEL_SECRETS_FILE: /run/secrets/usage-panel-env
  USAGE_PANEL_REQUIRE_SECRETS: "1"
  PG_POOL_SIZE: "10"
  TRUSTED_PROXY_HOPS: "1"
  AUTO_MIGRATE: "0"
  RETENTION_ENABLED: "1"
  RETENTION_INTERVAL_MS: "600000"
  REJECTION_RETENTION_DAYS: "30"
  REJECTION_RETENTION_CAP: "100000"
  AUDIT_RETENTION_DAYS: "180"
  AUDIT_RETENTION_CAP: "500000"
  SESSION_RETENTION_DAYS: "7"
  ENROLLMENT_RETENTION_DAYS: "7"
  HTTP_REQUEST_TIMEOUT_MS: "30000"
  HTTP_HEADERS_TIMEOUT_MS: "10000"
  HTTP_KEEPALIVE_TIMEOUT_MS: "5000"
  HTTP_MAX_REQUESTS_PER_SOCKET: "1000"

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: usage_panel
      POSTGRES_USER: usage_panel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U usage_panel -d usage_panel"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    shm_size: 128m
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    security_opt: [no-new-privileges:true]
    networks: [backend]

  migrate:
    <<: *app-security
    build:
      context: ..
      dockerfile: Dockerfile
    command: [server/migrate.js]
    environment:
      <<: *app-environment
      AUTO_MIGRATE: "1"
      RETENTION_ENABLED: "0"
    secrets: [usage-panel-env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  app:
    <<: *app-security
    build:
      context: ..
      dockerfile: Dockerfile
    command: [server/collector.js]
    environment: *app-environment
    secrets: [usage-panel-env]
    expose: ["8900"]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8900/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:?set CADDY_TLS_MODE to internal offline or an ACME email later}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
      - "${HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      # Use PUBLIC_DOMAIN for DNS and TLS SNI. Host-only headers against
      # https://127.0.0.1 send SNI=127.0.0.1 and Caddy rejects the handshake.
      test:
        [
          CMD-SHELL,
          'curl -fsS --max-time 2 -k --resolve "$$PUBLIC_DOMAIN:443:127.0.0.1" "https://$$PUBLIC_DOMAIN/health" -o /dev/null',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, backend]

  backup:
    profiles: [operations]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    # One-shot, capability-free root process can read the host root-only
    # secret and write the root-only backup destination; it is not a server.
    user: "0:0"
    entrypoint: [/ops/backup.sh]
    environment:
      USAGE_PANEL_SECRETS_FILE: /run/secrets/usage-panel-env
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_DESTINATION_ENCRYPTED: ${BACKUP_DESTINATION_ENCRYPTED:-0}
      BACKUP_RECIPIENT: ${BACKUP_RECIPIENT:-}
    secrets: [usage-panel-env]
    volumes:
      - ./backup.sh:/ops/backup.sh:ro
      - ./lib/secrets.sh:/ops/lib/secrets.sh:ro
      - ${BACKUP_DIR:?set BACKUP_DIR}:/backups
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks: [backend]

  restore:
    profiles: [restore]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    user: "0:0"
    entrypoint: [/ops/restore.sh]
    environment:
      USAGE_PANEL_SECRETS_FILE: /run/secrets/usage-panel-env
      BACKUP_FILE: /backups/${RESTORE_FILE:-usage-panel-RESTORE_FILE_REQUIRED.dump}
      BACKUP_DESTINATION_ENCRYPTED: ${BACKUP_DESTINATION_ENCRYPTED:-0}
    secrets: [usage-panel-env]
    volumes:
      - ./restore.sh:/ops/restore.sh:ro
      - ./lib/secrets.sh:/ops/lib/secrets.sh:ro
      - ${BACKUP_DIR:?set BACKUP_DIR}:/backups:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks: [backend]

  retention:
    profiles: [operations]
    <<: *app-security
    build:
      context: ..
      dockerfile: Dockerfile
    command: [server/retention.js]
    environment: *app-environment
    secrets: [usage-panel-env]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [backend]

secrets:
  usage-panel-env:
    file: ${USAGE_PANEL_SECRETS_FILE:?set USAGE_PANEL_SECRETS_FILE}
  postgres-password:
    file: ${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
