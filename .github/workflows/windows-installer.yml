name: Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-setup-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check Windows packaging contracts
        run: node test/windows-installer.test.js
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build Setup.exe with bundled Node
        shell: powershell
        run: ./installer/build-windows.ps1 -Version 1.0.3
      - name: Download the exact failed public v1.0.2 baseline
        shell: powershell
        run: |
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/Super-ZT/AI-Usage-Panel/releases/download/v1.0.2/UsagePanel-Setup-1.0.2.exe" `
            -OutFile "$env:RUNNER_TEMP\UsagePanel-Setup-1.0.2.exe"
      - name: Smoke-test true install-over v1.0.2, visible app, diagnostics, shortcuts, uninstall
        shell: powershell
        run: ./installer/windows-smoke.ps1 -Version 1.0.3 -BaselineInstaller "$env:RUNNER_TEMP\UsagePanel-Setup-1.0.2.exe"
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsagePanel-Setup-1.0.3
          path: |
            dist/UsagePanel-Setup-1.0.3.exe
            dist/UsagePanel-Setup-1.0.3.exe.sha256
            dist/UsagePanel-Setup-1.0.3.exe.evidence.txt
            installer/RELEASE_NOTES.md
            docs/evidence/OPUS_INTEGRATION_HANDOFF.md
          if-no-files-found: error
          retention-days: 30
