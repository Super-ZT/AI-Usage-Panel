name: Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-setup-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check Windows packaging contracts
        run: node test/windows-installer.test.js
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build Setup.exe with bundled Node
        shell: powershell
        run: ./installer/build-windows.ps1 -Version 1.0.2
      - name: Smoke-test launch handoff, shortcuts, and uninstall
        shell: powershell
        run: ./installer/windows-smoke.ps1 -Version 1.0.2
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsagePanel-Setup-1.0.2
          path: |
            dist/UsagePanel-Setup-1.0.2.exe
            dist/UsagePanel-Setup-1.0.2.exe.sha256
            installer/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
